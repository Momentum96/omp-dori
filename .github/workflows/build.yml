name: build

# Release binaries without a release (scripts/release.sh --add): on demand, each target builds
# `cargo build --locked --release --features voice` on its native runner with the release public key
# (repository variable CATALY_RELEASE_KEY), CATALY_COMMIT = the commit and SOURCE_DATE_EPOCH = its
# time, checks the binary's format and version report, and uploads it as the artifact
# cataly-<version>-<target>. Nothing is signed or published: the owner signs on his own machine.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: release binary (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
            format: "ELF 64-bit LSB.*x86-64"
          - target: linux-arm64
            os: ubuntu-24.04-arm
            format: "ELF 64-bit LSB.*ARM aarch64"
          - target: darwin-arm64
            os: macos-latest
            format: "Mach-O 64-bit.*arm64"
          - target: darwin-x64
            os: macos-15-intel
            format: "Mach-O 64-bit.*x86_64"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          target: ${{ matrix.target }}
          bun: "false"
      - id: build
        name: Release build (voice) with the release key, commit and commit time
        shell: bash
        env:
          CATALY_RELEASE_KEY: ${{ vars.CATALY_RELEASE_KEY }}
        run: |
          set -euo pipefail
          echo "$CATALY_RELEASE_KEY" | grep -Eq '^[0-9a-f]{64}$' || { echo "repository variable CATALY_RELEASE_KEY is not 64 hex digits"; exit 1; }
          version=$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          CATALY_COMMIT="$GITHUB_SHA" SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
            cargo build --locked --release --features voice
          b=target/release/cataly
          file "$b" | grep -Eq "${{ matrix.format }}"
          "$b" version --json | tee report.json
          grep -q "\"target\":\"${{ matrix.target }}\"" report.json
          grep -q "\"version\":\"$version\"" report.json
          grep -q "\"commit\":\"$GITHUB_SHA\"" report.json
          mkdir -p out
          cp "$b" "out/cataly-$version-${{ matrix.target }}"
          echo "name=cataly-$version-${{ matrix.target }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.build.outputs.name }}
          path: out/${{ steps.build.outputs.name }}
          if-no-files-found: error
