name: setup
description: >
  The Rust toolchain from rust-toolchain.toml, the Cargo cache (per OS, CPU, target and Cargo.lock)
  and, unless bun is false, Bun with its package cache (per OS, CPU and extension/bun.lock). Every
  workflow job that builds Cataly runs this after actions/checkout.

inputs:
  target:
    description: The release target this job builds (linux-x64, linux-arm64, darwin-arm64, darwin-x64).
    required: true
  bun:
    description: Whether the job needs Bun.
    default: "true"

runs:
  using: composite
  steps:
    - name: Toolchain (rust-toolchain.toml)
      shell: bash
      run: rustup show active-toolchain || rustup toolchain install
    # Downloaded crates and compiled dependencies only (the workspace's own crates are always
    # rebuilt); every build and test step runs as it would without the cache. The action keys on
    # the job, the OS, the CPU, rustc and Cargo.lock; the target is added here.
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: ${{ inputs.target }}
    - if: inputs.bun == 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.0
    - if: inputs.bun == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('extension/bun.lock') }}
