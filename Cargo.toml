[workspace]
members = ["."]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "LicenseRef-Proprietary"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
print_stdout = "deny"

[package]
name = "cataly"
version = "0.1.0"
description = "Cataly hub, CLI and job engine"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "cataly"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
jiff = { version = "0.2.46", default-features = false, features = ["std", "tzdb-zoneinfo"] }
ring = { version = "0.17.14", default-features = false }
rusqlite = { version = "0.37.0", default-features = false, features = ["bundled"] }
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs", "process"] }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "net", "process", "time", "signal", "sync", "io-util", "macros"] }
toml = { version = "0.9.12", default-features = false, features = ["std", "parse", "serde"] }

[profile.release]
panic = "unwind"
codegen-units = 1
lto = "thin"
strip = "symbols"
