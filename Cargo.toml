[workspace]
members = [".", "crates/voice"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "LicenseRef-Proprietary"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
print_stdout = "deny"

[package]
name = "cataly"
version = "0.1.0"
description = "Cataly hub, CLI and job engine"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "cataly"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Voice calls (DESIGN 5.2, 10.1): libopus, DAVE/MLS and WebRTC link only into builds with it.
voice = ["dep:cataly-voice"]

[dependencies]
cataly-voice = { path = "crates/voice", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
http-body-util = { version = "0.1.5", default-features = false }
hyper = { version = "1.12", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
jiff = { version = "0.2.46", default-features = false, features = ["std", "tzdb-zoneinfo"] }
regex = { version = "1.13", default-features = false, features = ["std", "perf"] }
ring = { version = "0.17.14", default-features = false }
rusqlite = { version = "0.37.0", default-features = false, features = ["bundled"] }
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs", "process"] }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "net", "process", "time", "signal", "sync", "io-util", "macros"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
toml = { version = "0.9.12", default-features = false, features = ["std", "parse", "serde"] }
unicode-width = { version = "0.2.2", default-features = false }
webpki-roots = { version = "1.0.12", default-features = false }

[dev-dependencies]
hyper = { version = "1.12", default-features = false, features = ["server", "http1"] }

[profile.release]
panic = "unwind"
codegen-units = 1
lto = "thin"
strip = "symbols"
