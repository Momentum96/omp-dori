[package]
name = "cataly-voice"
version = "0.1.3"
description = "Cataly voice calls: Discord voice, DAVE, Opus and the realtime model link"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
audiopus = { version = "0.3.0-rc.0", default-features = false, features = ["coder"] }
audiopus_sys = { version = "0.2.2", default-features = false, features = ["static"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
davey = { version = "0.2.0", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
ring = { version = "0.17.14", default-features = false }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
str0m = { version = "0.26.0", default-features = false, features = ["rust-crypto"] }
tokio = { version = "1.54.1", default-features = false, features = ["net", "time", "sync", "macros", "rt"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[dev-dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "io-util", "net", "time", "sync"] }
